<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">码上开玩</title>
  <desc id="desc">蓝紫渐变圆角方块与四格数字方块标志</desc>
  <defs>
    <linearGradient id="brand" x1="8" y1="6" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4D74D8"/>
      <stop offset="1" stop-color="#6D4CE0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#263E8C" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="17" fill="url(#brand)" filter="url(#shadow)"/>
  <g fill="#fff">
    <rect x="17" y="17" width="13" height="13" rx="3"/>
    <rect x="34" y="17" width="13" height="13" rx="3" opacity=".78"/>
    <rect x="17" y="34" width="13" height="13" rx="3" opacity=".78"/>
    <rect x="34" y="34" width="13" height="13" rx="3"/>
  </g>
</svg>
